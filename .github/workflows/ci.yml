name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test on Node v20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run codegen
        run: npm run codegen
        env:
          CI: true

      - name: Install generated dependencies
        working-directory: generated
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run codegen
        run: npm run codegen
        env:
          CI: true

      - name: Install generated dependencies
        working-directory: generated
        run: npm install --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Check code formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
        continue-on-error: true
